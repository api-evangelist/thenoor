aid: thenoor
name: TheNoor
description: >-
  TheNoor is a Shariah-inspired and guided company behind "TheNoor" — an Islamic
  lifestyle mobile application for Muslims, available on iOS and Android. The app
  bundles daily religious and lifestyle utilities such as prayer times, Qibla
  direction, Quran, Islamic calendar, and related community and content features
  into a single consumer product. TheNoor is a 500 Global portfolio company. As
  of this enrichment pass the company exposes only a consumer website and a
  private mobile backend at api.thenoor.co; it publishes no public developer API,
  OpenAPI definition, SDKs, developer portal, or API documentation.
